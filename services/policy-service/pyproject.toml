[project]
name = "ngsh-policy-service"
version = "0.1.0"
description = "NGSH policy service: the Policy Decision Point for attribute-based access control across the platform."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-policy-service = "ngsh_policy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_policy"]

[tool.ruff]
# Inherit the repository-wide ruff configuration so that the settings
# cannot drift between packages. Exclusions are resolved relative to
# this file, so they are re-expressed here.
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
