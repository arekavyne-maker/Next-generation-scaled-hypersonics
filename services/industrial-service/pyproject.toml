[project]
name = "ngsh-industrial-service"
version = "0.1.0"
description = "Pillar H: surge readiness, reconstitution planning and affordability."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-industrial-service = "ngsh_industrial.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_industrial"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
