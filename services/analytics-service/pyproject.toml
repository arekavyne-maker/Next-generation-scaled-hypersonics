[project]
name = "ngsh-analytics-service"
version = "0.1.0"
description = "NGSH analytics service."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-analytics-service = "ngsh_analytics.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_analytics"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
