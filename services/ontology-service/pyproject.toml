[project]
name = "ngsh-ontology-service"
version = "0.1.0"
description = "NGSH ontology service: serves the shared ontology registry, validates entities and relations against the contract layer, and enforces cross-entity invariants."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-ontology-service = "ngsh_ontology.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_ontology"]

[tool.ruff]
# Inherit the repository-wide ruff configuration so that the settings
# cannot drift between packages. Exclusions are resolved relative to
# this file, so they are re-expressed here.
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
