[project]
name = "ngsh-workforce-service"
version = "0.1.0"
description = "Pillar E: skills, credentials and the cleared-workforce gap."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-workforce-service = "ngsh_workforce.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_workforce"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
