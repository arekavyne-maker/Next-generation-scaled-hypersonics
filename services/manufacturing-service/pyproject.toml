[project]
name = "ngsh-manufacturing-service"
version = "0.1.0"
description = "Pillar B: travellers, genealogy, drift detection and rate simulation."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-manufacturing-service = "ngsh_manufacturing.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_manufacturing"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
