[project]
name = "ngsh-audit-service"
version = "0.1.0"
description = "NGSH audit service: the tamper-evident, hash-chained record of access decisions and other auditable actions."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-audit-service = "ngsh_audit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_audit"]

[tool.ruff]
# Inherit the repository-wide ruff configuration so that the settings
# cannot drift between packages. Exclusions are resolved relative to
# this file, so they are re-expressed here.
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
