[project]
name = "ngsh-thread-service"
version = "0.1.0"
description = "NGSH thread service: the digital thread projection and the traversal queries that sit on top of it."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-thread-service = "ngsh_thread.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_thread"]

[tool.ruff]
# Inherit the repository-wide ruff configuration so that the settings
# cannot drift between packages. Exclusions are resolved relative to
# this file, so they are re-expressed here.
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
