[project]
name = "ngsh-testlab-service"
version = "0.1.0"
description = "Pillar C: test campaigns, configuration context, anomaly surfacing and the twin loop."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-testlab-service = "ngsh_testlab.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_testlab"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
