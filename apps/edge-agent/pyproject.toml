[project]
name = "ngsh-edge-agent"
version = "0.1.0"
description = "NGSH edge annex agent: capture, local read and deterministic reconciliation for a factory floor or test range annex."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["ngsh-core"]

[project.scripts]
ngsh-edge-agent = "ngsh_edge.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsh_edge"]
