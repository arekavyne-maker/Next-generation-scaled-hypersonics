[project]
name = "ngsh-core"
version = "0.1.0"
description = "Shared domain primitives for the NGSH platform: event envelopes, ontology, policy engine, audit ledger, event log and digital-thread projection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "NGSH Platform Team" }]
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngsh_core"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff]
# Inherit the repository-wide ruff configuration so that the settings
# cannot drift between packages. Exclusions are resolved relative to
# this file, so they are re-expressed here.
extend = "../../pyproject.toml"
extend-exclude = ["**/generated/**"]
