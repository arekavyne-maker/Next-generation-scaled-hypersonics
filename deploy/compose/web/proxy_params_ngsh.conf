# =============================================================================
# NGSH web console — shared reverse-proxy parameters
# =============================================================================
# Common proxy headers for every /api/<service>/ location block.
# Kept in its own file so the routing rules in nginx.conf stay readable.
# =============================================================================

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Trace context: the console is a distributed-tracing participant like every
# other NGSH component. W3C traceparent/tracestate are forwarded verbatim so
# the trace continues across the browser -> nginx -> service hop.
proxy_set_header traceparent       $http_traceparent;
proxy_set_header tracestate        $http_tracestate;
proxy_set_header baggage           $http_baggage;

# Correlation header used by the platform for request-level correlation.
proxy_set_header X-Request-Id      $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering off;
