# =============================================================================
# NGSH web console — nginx site configuration
# =============================================================================
# Serves the static console build and reverse-proxies the platform API surface
# to the six backend services. Deliberately plain nginx: no provider-specific
# directives, no cloud-specific auth modules, no vendor WAF.
#
# The upstream names match the Compose service names on the ngsh-core network.
# In a Kubernetes deployment the equivalent routing is provided by the Helm
# chart's Ingress plus per-service Services; see deploy/helm/ngsh.
# =============================================================================

upstream ngsh_ontology_service {
    server ontology-service:8081;
}

upstream ngsh_fabric_service {
    server fabric-service:8082;
}

upstream ngsh_policy_service {
    server policy-service:8083;
}

upstream ngsh_audit_service {
    server audit-service:8084;
}

upstream ngsh_thread_service {
    server thread-service:8085;
}

upstream ngsh_ingest_service {
    server ingest-service:8086;
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The console is a single-page application: unknown paths are routed to the
    # client-side router, not to the API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If the frontend bundle has not been built yet, surface the placeholder
    # instead of a bare 404 so the platform state is obvious.
    error_page 404 =200 /placeholder.html;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","service":"ngsh-web-console","profile":"local"}';
    }

    # ---- API surface -------------------------------------------------------
    # Each prefix maps onto exactly one backend service. The trailing slash is
    # stripped so that /api/ontology/entity/SYS:1 reaches the service as
    # /entity/SYS:1.

    location /api/ontology/ {
        proxy_pass http://ngsh_ontology_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    location /api/fabric/ {
        proxy_pass http://ngsh_fabric_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    location /api/policy/ {
        proxy_pass http://ngsh_policy_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    location /api/audit/ {
        proxy_pass http://ngsh_audit_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    location /api/thread/ {
        proxy_pass http://ngsh_thread_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    location /api/ingest/ {
        proxy_pass http://ngsh_ingest_service/;
        include /etc/nginx/proxy_params_ngsh.conf;
    }

    # Static assets are immutable once hashed by the bundler.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 64m;
}
