      NGSH_SERVICE_NAME: architecture-service
      PORT: "8088"
      NGSH_PORT: "8088"
      NGSH_DATA_DIR: /var/lib/ngsh/architecture
      NGSH_FABRIC_URL: "http://fabric-service:8082"
      NGSH_ONTOLOGY_URL: "http://ontology-service:8081"
      NGSH_POLICY_URL: "http://policy-service:8083"
      NGSH_AUDIT_URL: "http://audit-service:8084"
      NGSH_THREAD_URL: "http://thread-service:8085"
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
      - ngsh-architecture-data:/var/lib/ngsh/architecture
    ports:
      - target: 8088
        published: "${ARCHITECTURE_HOST_PORT:-8088}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
      ontology-service:
        condition: service_healthy
