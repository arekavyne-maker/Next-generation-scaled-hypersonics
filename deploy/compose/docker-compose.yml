  # -----------------------------------------------------------------------------
  # Edge annex (optional, disconnected demonstration topology)
  # -----------------------------------------------------------------------------
  #   docker compose --profile edge up
  #
  # The edge annex runs on an `internal: true` network. It has NO route to the
  # central fabric: reconciliation is a sanctioned store-and-forward transfer
  # performed by operations, not a live connection. See deploy/README.md,
  # "Zone 3 — Segregated edge annex".
  # -----------------------------------------------------------------------------
  edge-postgres:
    profiles: ["edge"]
    image: postgres:16-alpine
    container_name: ngsh-edge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ngsh_root}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ngsh-dev-placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-ngsh}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - edge-pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-ngsh-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - ngsh-edge

  edge-fabric-service:
    profiles: ["edge"]
    <<: *ngsh-service-base
    image: ${NGSH_FABRIC_IMAGE:-ngsh/fabric-service:dev}
    build:
      context: ../../
      dockerfile: services/fabric-service/Dockerfile
      args:
        SERVICE_NAME: fabric-service
    container_name: ngsh-edge-fabric-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: fabric-service
      PORT: "8082"
      NGSH_PORT: "8082"
      # The edge profile permits the stub identity adapter.
      NGSH_DEPLOYMENT_PROFILE: "edge"
      NGSH_DEPLOYMENT_ZONE: "edge-annex"
      NGSH_EDGE_MODE: "true"
      NGSH_EDGE_NODE_ID: ${NGSH_EDGE_NODE_ID:-edge-node-01}
      NGSH_DATA_DIR: /var/lib/ngsh/fabric
      # The annex has its own store. It never points at the central fabric's.
      NGSH_DSN: "sqlite:////var/lib/ngsh/platform/ngsh.db"
      DATABASE_URL: "sqlite:////var/lib/ngsh/platform/ngsh.db"
    volumes:
      - ngsh-edge-data:/var/lib/ngsh/platform
      - ngsh-edge-fabric-data:/var/lib/ngsh/fabric
    depends_on:
      init-data:
        condition: service_completed_successfully
      edge-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ngsh-edge

  edge-ingest-service:
    profiles: ["edge"]
    <<: *ngsh-service-base
    image: ${NGSH_INGEST_IMAGE:-ngsh/ingest-service:dev}
    build:
      context: ../../
      dockerfile: services/ingest-service/Dockerfile
      args:
        SERVICE_NAME: ingest-service
    container_name: ngsh-edge-ingest-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: ingest-service
      PORT: "8086"
      NGSH_PORT: "8086"
      NGSH_DEPLOYMENT_PROFILE: "edge"
      NGSH_DEPLOYMENT_ZONE: "edge-annex"
      NGSH_EDGE_MODE: "true"
      NGSH_EDGE_NODE_ID: ${NGSH_EDGE_NODE_ID:-edge-node-01}
      NGSH_DATA_DIR: /var/lib/ngsh/ingest
      NGSH_FABRIC_URL: "http://edge-fabric-service:8082"
      NGSH_DSN: "sqlite:////var/lib/ngsh/platform/ngsh.db"
      DATABASE_URL: "sqlite:////var/lib/ngsh/platform/ngsh.db"
    volumes:
      - ngsh-edge-data:/var/lib/ngsh/platform
      - ngsh-edge-ingest-data:/var/lib/ngsh/ingest
    depends_on:
      init-data:
        condition: service_completed_successfully
      edge-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ngsh-edge

  # -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
#   ngsh-core : east-west fabric traffic plus the datastore.
#   ngsh-edge : `internal: true` — no gateway, no egress. Edge annex nodes
#               reconcile out of band; they never dial the central fabric.
# -----------------------------------------------------------------------------
networks:
  ngsh-core:
    name: ngsh-core
    driver: bridge
  ngsh-edge:
    name: ngsh-edge
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Named volumes (data survives `down`, is removed by `down -v`)
# -----------------------------------------------------------------------------
volumes:
  # The shared platform database the six services open in development mode.
  ngsh-data:
    name: ngsh-data
  pgdata:
    name: ngsh-pgdata
  ngsh-fabric-data:
    name: ngsh-fabric-data
  ngsh-ontology-data:
    name: ngsh-ontology-data
  ngsh-audit-data:
    name: ngsh-audit-data
  ngsh-graph-data:
    name: ngsh-graph-data
  ngsh-ingest-data:
    name: ngsh-ingest-data
  ngsh-architecture-data:
    name: ngsh-architecture-data
  ngsh-workforce-data:
    name: ngsh-workforce-data
  ngsh-manufacturing-data:
    name: ngsh-manufacturing-data
  ngsh-testlab-data:
    name: ngsh-testlab-data
  ngsh-supply-data:
    name: ngsh-supply-data
  ngsh-engagement-data:
    name: ngsh-engagement-data
  ngsh-industrial-data:
    name: ngsh-industrial-data
  ngsh-analytics-data:
    name: ngsh-analytics-data
  ngsh-integration-data:
    name: ngsh-integration-data
  ngsh-edge-data:
    name: ngsh-edge-data
  ngsh-edge-fabric-data:
    name: ngsh-edge-fabric-data
  ngsh-edge-ingest-data:
    name: ngsh-edge-ingest-data
  edge-pgdata:
    name: ngsh-edge-pgdata
