# =============================================================================
# NGSH — Local Development Topology
# =============================================================================
#
# Platform-agnostic by construction: plain OCI images, plain env vars, no
# cloud-provider SDKs and no provider-specific service calls anywhere in this
# file. The same six backend services land unchanged in an accredited cloud
# enclave, an on-prem IL6 enclave, or a disconnected edge annex.
#
# Topology
# --------
#                      +------------------+
#                      |  web console     |  nginx, static build of apps/web
#                      |  :8080           |
#                      +--------+---------+
#                               |
#   +-----------------+---------+---------+-----------------+
#   |                 |                   |                 |
# +---------+  +-----------+  +-----------+  +-----------+  +-----------+
# |ontology |  |  fabric   |  |  policy   |  |   audit   |  |  thread   |
# | :8081   |  |  :8082    |  |  :8083    |  |  :8084    |  |  :8085    |
# +---------+  +-----------+  +-----------+  +-----------+  +-----------+
#                          \        |        /                 |
#                           \       |       /                  |
#                       +-----------+------------+       +-----------+
#                       | postgres :5432         |       | ingest    |
#                       | (target relational      |       | :8086     |
#                       |  store + graph          |       +-----------+
#                       |  projection schema)     |
#                       +------------------------+
#          all six services share one platform database on `ngsh-data`
#
#   +---------------------------------------+
#   | otel-collector :4317 / :4318 / :13133 |
#   | (OTLP in, generic OTLP out)           |
#   +---------------------------------------+
#
# Port map (host -> container)
#   8080  web console            4317  otel OTLP/gRPC
#   8081  ontology-service       4318  otel OTLP/HTTP
#   8082  fabric-service         13133  otel health check
#   8083  policy-service         5432  postgres
#   8084  audit-service
#   8085  thread-service
#   8086  ingest-service
#
# ---------------------------------------------------------------------------
# Image contract (owned by the application teams, consumed by this file)
# ---------------------------------------------------------------------------
#   Each backend service provides a Dockerfile at
#       services/<service-name>/Dockerfile
#   built from this repository root as the build context, and it:
#     * listens on $PORT
#     * exposes GET /healthz  -> 200 application/json  (liveness)
#     * exposes GET /readyz   -> 200 application/json  (readiness)
#     * runs as uid/gid 65532 and provides `curl`
#   The web console image is owned by this directory (deploy/compose/web).
#
# ---------------------------------------------------------------------------
# Configuration sources
# ---------------------------------------------------------------------------
#   1. ../../.env.example  — shared application env file (optional; loaded via
#      env_file with required:false so a missing file never blocks the stack).
#   2. deploy/compose/.env — Compose interpolation source. Copy it from
#      ../../.env.example or edit it to override any ${VAR:-default} below.
#   3. `environment:` in this file — structural values (ports, service URLs,
#      OTel resource attributes) that are derived, not operator-supplied.
#
#   `environment:` wins over `env_file:` for the same key, so the structural
#   values below are deterministic. The shared example file therefore cannot
#   silently redirect the stack.
# ============================================================================

name: ngsh

# -----------------------------------------------------------------------------
# Shared fragments
# -----------------------------------------------------------------------------

# Environment shared by every NGSH service. Values that an operator is
# expected to tune come from env_file / the project .env; the ones below are
# either structural or derived.
x-ngsh-common-env: &ngsh-common-env
  NGSH_ENVIRONMENT: ${NGSH_ENVIRONMENT:-local}
  NGSH_DEPLOYMENT_PROFILE: ${NGSH_DEPLOYMENT_PROFILE:-local}
  NGSH_DEPLOYMENT_ZONE: ${NGSH_DEPLOYMENT_ZONE:-local-dev}
  NGSH_CLASSIFICATION_LEVEL: ${NGSH_CLASSIFICATION_LEVEL:-UNCLASSIFIED}
  NGSH_TENANT: ${NGSH_TENANT:-ngsh-local}
  NGSH_HOST: "0.0.0.0"
  # The stub identity adapter is permitted in the local and edge profiles only.
  # The platform refuses it anywhere else.
  NGSH_IDENTITY_PROVIDER: ${NGSH_IDENTITY_PROVIDER:-stub}
  NGSH_LOG_LEVEL: ${NGSH_LOG_LEVEL:-INFO}
  NGSH_LOG_FORMAT: ${NGSH_LOG_FORMAT:-json}
  NGSH_GRAPH_BACKEND: ${NGSH_GRAPH_BACKEND:-postgres}
  NGSH_EDGE_MODE: "false"
  # Storage. The platform's configuration layer reads NGSH_DSN first and
  # DATABASE_URL second, so both are set to the same value.
  #
  # The default is SQLite on the shared `ngsh-data` volume, which is the
  # storage engine the platform currently implements. The PostgreSQL service
  # below is provisioned and ready; point the stack at it with:
  #   NGSH_DSN=postgresql://ngsh_app:ngsh-dev-placeholder@postgres:5432/ngsh
  NGSH_DSN: ${NGSH_DSN:-sqlite:////var/lib/ngsh/platform/ngsh.db}
  DATABASE_URL: ${NGSH_DSN:-sqlite:////var/lib/ngsh/platform/ngsh.db}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ngsh,service.version=${NGSH_VERSION:-dev},deployment.profile=${NGSH_DEPLOYMENT_PROFILE:-local},deployment.zone.name=${NGSH_DEPLOYMENT_ZONE:-local-dev},ngsh.classification.level=${NGSH_CLASSIFICATION_LEVEL:-UNCLASSIFIED},ngsh.tenant=${NGSH_TENANT:-ngsh-local}"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Per-service defaults. Healthchecks are declared per service because the port
# differs; everything else is identical.
x-ngsh-service-base: &ngsh-service-base
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - ngsh-core
  env_file:
    - path: ../../.env.example
      required: false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# -----------------------------------------------------------------------------
# Datastores
# -----------------------------------------------------------------------------

services:

  # The service images run as uid/gid 65532. Named volumes are created
  # root-owned, so one short-lived container hands them over before any
  # service starts. It exits immediately and is never in the request path.
  init-data:
    image: alpine:3.20
    container_name: ngsh-init-data
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -eu
        chown 65532:65532 /data
        chmod 0770 /data
        for d in /data/*; do
          [ -d "$$d" ] || continue
          chown -R 65532:65532 "$$d"
          chmod 0770 "$$d"
        done
        echo "data volumes ready"
    volumes:
      - ngsh-data:/data
      - ngsh-fabric-data:/data/fabric
      - ngsh-ontology-data:/data/ontology
      - ngsh-audit-data:/data/audit
      - ngsh-graph-data:/data/graph
      - ngsh-ingest-data:/data/ingest
      - ngsh-edge-data:/data/edge
      - ngsh-edge-fabric-data:/data/edge/fabric
      - ngsh-edge-ingest-data:/data/edge/ingest
    restart: "no"
    networks:
      - ngsh-core

  postgres:
    image: postgres:16-alpine
    container_name: ngsh-postgres
    environment:
      # Bootstrap superuser. The runtime roles (ngsh_admin / ngsh_app /
      # ngsh_readonly) are created by postgres/init.sql.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-ngsh_root}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ngsh-dev-placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-ngsh}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-ngsh-init.sql:ro
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - ngsh-core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Graph store
# ---------------------------------------------------------------------------
# The property graph is projected into the `graph` schema of the platform's
# relational store — the shared SQLite database locally, and the `graph`
# schema of PostgreSQL once the stack is pointed at it.
#
# This is a deliberate placeholder, NOT a graph database. The thread service
# speaks to the graph through a single narrow adapter selected by
# NGSH_GRAPH_BACKEND / NGSH_GRAPH_URL, so the swap is a configuration change
# plus one adapter implementation — see deploy/compose/README.md, section
# "Graph store: local stand-in and the path to Neptune/JanusGraph".
#
# When an accredited graph engine becomes available, uncomment the block below
# and point the thread service at it. No other change is required, and no
# provider-specific field is introduced.
#
# graph:
#   image: janusgraph/janusgraph:1.1.0
#   container_name: ngsh-graph
#   environment:
#     janusgraph.storage.backend: berkeleyje
#     janusgraph.storage.directory: /var/lib/janusgraph/data
#   volumes:
#     - graph-data:/var/lib/janusgraph/data
#   ports:
#     - target: 8182
#       published: "8182"
#       protocol: tcp
#   healthcheck:
#     test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8182/ || exit 1"]
#     interval: 15s
#     timeout: 5s
#     retries: 10
#     start_period: 30s
#   networks:
#     - ngsh-core
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Observability — OpenTelemetry Collector
# ---------------------------------------------------------------------------
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.109.0}
    container_name: ngsh-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4317}
      OTEL_EXPORTER_OTLP_TLS_INSECURE: ${OTEL_EXPORTER_OTLP_TLS_INSECURE:-false}
      NGSH_CLASSIFICATION_LEVEL: ${NGSH_CLASSIFICATION_LEVEL:-UNCLASSIFIED}
      NGSH_DEPLOYMENT_PROFILE: ${NGSH_DEPLOYMENT_PROFILE:-local}
      NGSH_DEPLOYMENT_ZONE: ${NGSH_DEPLOYMENT_ZONE:-local-dev}
      OTEL_DEBUG_VERBOSITY: ${OTEL_DEBUG_VERBOSITY:-normal}
    volumes:
      - ../otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - target: 4317
        published: "${OTEL_GRPC_HOST_PORT:-4317}"
        protocol: tcp
        mode: host
      - target: 4318
        published: "${OTEL_HTTP_HOST_PORT:-4318}"
        protocol: tcp
        mode: host
      - target: 13133
        published: "${OTEL_HEALTH_HOST_PORT:-13133}"
        protocol: tcp
        mode: host
    # The upstream collector image is distroless: no shell, no wget, no curl.
    # Liveness is provided by the collector's own health_check extension on
    # :13133 and is asserted by the platform's external probe, not by Compose.
    healthcheck:
      disable: true
    networks:
      - ngsh-core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------------------
  # Platform services
  # -----------------------------------------------------------------------------

  fabric-service:
    <<: *ngsh-service-base
    image: ${NGSH_FABRIC_IMAGE:-ngsh/fabric-service:dev}
    build:
      context: ../../
      dockerfile: services/fabric-service/Dockerfile
      args:
        SERVICE_NAME: fabric-service
    container_name: ngsh-fabric-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: fabric-service
      PORT: "8082"
      NGSH_PORT: "8082"
      NGSH_DATA_DIR: /var/lib/ngsh/fabric
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
      - ngsh-fabric-data:/var/lib/ngsh/fabric
    ports:
      - target: 8082
        published: "${FABRIC_HOST_PORT:-8082}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ontology-service:
    <<: *ngsh-service-base
    image: ${NGSH_ONTOLOGY_IMAGE:-ngsh/ontology-service:dev}
    build:
      context: ../../
      dockerfile: services/ontology-service/Dockerfile
      args:
        SERVICE_NAME: ontology-service
    container_name: ngsh-ontology-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: ontology-service
      PORT: "8081"
      NGSH_PORT: "8081"
      NGSH_DATA_DIR: /var/lib/ngsh/ontology
      NGSH_FABRIC_URL: "http://fabric-service:8082"
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
      - ngsh-ontology-data:/var/lib/ngsh/ontology
    ports:
      - target: 8081
        published: "${ONTOLOGY_HOST_PORT:-8081}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  policy-service:
    <<: *ngsh-service-base
    image: ${NGSH_POLICY_IMAGE:-ngsh/policy-service:dev}
    build:
      context: ../../
      dockerfile: services/policy-service/Dockerfile
      args:
        SERVICE_NAME: policy-service
    container_name: ngsh-policy-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: policy-service
      PORT: "8083"
      NGSH_PORT: "8083"
      NGSH_DATA_DIR: /var/lib/ngsh/policy
      NGSH_FABRIC_URL: "http://fabric-service:8082"
      NGSH_ONTOLOGY_URL: "http://ontology-service:8081"
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
    ports:
      - target: 8083
        published: "${POLICY_HOST_PORT:-8083}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
      ontology-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  audit-service:
    <<: *ngsh-service-base
    image: ${NGSH_AUDIT_IMAGE:-ngsh/audit-service:dev}
    build:
      context: ../../
      dockerfile: services/audit-service/Dockerfile
      args:
        SERVICE_NAME: audit-service
    container_name: ngsh-audit-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: audit-service
      PORT: "8084"
      NGSH_PORT: "8084"
      NGSH_DATA_DIR: /var/lib/ngsh/audit
      NGSH_FABRIC_URL: "http://fabric-service:8082"
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
      - ngsh-audit-data:/var/lib/ngsh/audit
    ports:
      - target: 8084
        published: "${AUDIT_HOST_PORT:-8084}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  thread-service:
    <<: *ngsh-service-base
    image: ${NGSH_THREAD_IMAGE:-ngsh/thread-service:dev}
    build:
      context: ../../
      dockerfile: services/thread-service/Dockerfile
      args:
        SERVICE_NAME: thread-service
    container_name: ngsh-thread-service
    environment:
      <<: *ngsh-common-env
      NGSH_SERVICE_NAME: thread-service
      PORT: "8085"
      NGSH_PORT: "8085"
      NGSH_DATA_DIR: /var/lib/ngsh/graph
      NGSH_FABRIC_URL: "http://fabric-service:8082"
      NGSH_ONTOLOGY_URL: "http://ontology-service:8081"
      # Graph adapter selection. "postgres" is the local stand-in; the migration
      # path to neptune / janusgraph is a config change, not a code change in
      # any other service.
      NGSH_GRAPH_BACKEND: ${NGSH_GRAPH_BACKEND:-postgres}
      NGSH_GRAPH_URL: ${NGSH_GRAPH_URL:-postgresql://postgres:5432/ngsh}
      NGSH_GRAPH_NAMESPACE: ${NGSH_GRAPH_NAMESPACE:-graph}
    volumes:
      - ngsh-data:/var/lib/ngsh/platform
      - ngsh-graph-data:/var/lib/ngsh/graph
    ports:
      - target: 8085
        published: "${THREAD_HOST_PORT:-8085}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
      ontology-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  architecture-service:
    <<: *ngsh-service-base
    image: ${NGSH_ARCHITECTURE_IMAGE:-ngsh/architecture-service:dev}
    build:
      context: ../../
