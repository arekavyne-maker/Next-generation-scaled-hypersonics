        published: "${WORKFORCE_HOST_PORT:-8089}"
        protocol: tcp
        mode: host
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fabric-service:
        condition: service_healthy
      ontology-service:
        condition: service_healthy
      thread-service:
