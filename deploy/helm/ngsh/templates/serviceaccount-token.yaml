{{/*
================================================================================
NGSH — Workload identity service account

A dedicated service account for federated workload identity. The pods run as
this account when `serviceAccount.workloadIdentity.enabled` is true.

The projected, audience-scoped token is created by the API server and mounted
into each container by the deployment template (see the
`workload-identity-token` projected volume). It is short-lived, audience-bound
and not the default service account token.

Annotations for a specific identity provider belong here. They are supplied
by the operator as `serviceAccount.workloadIdentity.annotations`; the chart
does not hard-code any provider-specific annotation.
================================================================================
*/}}
{{- $v := include "ngsh.effectiveValues" . | fromYaml }}
{{- if $v.serviceAccount.workloadIdentity.enabled }}
{{- $name := printf "%s-workload-identity" (include "ngsh.fullname" $v) | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    ngsh.io/workload-identity-audience: {{ $v.serviceAccount.workloadIdentity.audience | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
    {{- with $v.serviceAccount.workloadIdentity.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- if $v.serviceAccount.workloadIdentity.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
rules:
  # Token exchange is performed by the platform's own identity broker, which
  # runs outside this chart. The service account therefore needs no
  # Kubernetes API access of its own beyond reading its own configuration.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "ngsh.configMapName" $v }}
    verbs: ["get"]
  {{- with $v.serviceAccount.workloadIdentity.rbac.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: workload-identity
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $v.releaseNamespace }}
{{- end }}
{{- end }}
