{{/*
================================================================================
NGSH — Service account

The runtime identity of the platform services.

The default API token is never mounted (`automountServiceAccountToken: false`).
Services that need to authenticate to an external identity provider use the
dedicated workload-identity service account and its audience-scoped projected
token instead — see serviceaccount-token.yaml.

The Role granted here is deliberately minimal: read access to this release's
own ConfigMap and Secret, and nothing else. The platform does not read other
namespaces, and it never holds a cluster-admin binding.
================================================================================
*/}}
{{- $v := include "ngsh.effectiveValues" . | fromYaml }}
{{- if $v.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ngsh.serviceAccountName" $v }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: rbac
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
    {{- with $v.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ $v.serviceAccount.automountServiceAccountToken }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ngsh.serviceAccountName" $v }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: rbac
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames:
      - {{ include "ngsh.configMapName" $v }}
      - {{ include "ngsh.secretName" $v }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ngsh.serviceAccountName" $v }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: rbac
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ngsh.serviceAccountName" $v }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ngsh.serviceAccountName" $v }}
    namespace: {{ $v.releaseNamespace }}
{{- end }}
