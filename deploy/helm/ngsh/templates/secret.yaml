{{/*
================================================================================
NGSH — Application secrets

Rendered from `values.secrets` as `stringData`, so the values are visible in
the rendered manifest and in the release history. That is acceptable ONLY
because every default is a placeholder. In an accredited zone the chart is
installed with `existingSecret` pointing at a Secret provisioned by the
platform's secret manager, and this template renders nothing at all.

The DATABASE_URL is assembled from the individual fields so that the password
does not have to be written twice. Percent-encode any password character that
is reserved in a URI (the password is interpolated verbatim).
================================================================================
*/}}
{{- $v := include "ngsh.effectiveValues" . | fromYaml }}
{{- if not $v.existingSecret }}
{{- $databaseUrl := printf "postgres://%s:%s@%s:%v/%s"
      $v.secrets.postgresUser
      $v.secrets.postgresPassword
      $v.secrets.postgresHost
      $v.secrets.postgresPort
      $v.secrets.postgresDatabase -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngsh.secretName" $v }}
  labels:
    {{- include "ngsh.labels" $v | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    ngsh.io/deployment-profile: {{ $v.activeProfile | quote }}
    {{- include "ngsh.commonAnnotations" $v | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $v.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $v.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  JWT_SIGNING_KEY: {{ $v.secrets.jwtSigningKey | quote }}
  OIDC_CLIENT_SECRET: {{ $v.secrets.oidcClientSecret | quote }}
  FABRIC_SIGNING_KEY: {{ $v.secrets.fabricSigningKey | quote }}
{{- end }}
